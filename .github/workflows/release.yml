name: Build release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Flutter 3.47.x can crash or render a black window on older Windows
          # 10 GPUs limited to D3D11 feature level 9_3. Keep the Windows
          # release on the last field-validated stable build until the fix is
          # available in a stable Flutter release.
          flutter-version: '3.44.2'
          cache: true
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: pwsh
        run: |
          $flutterBat = (Get-Command flutter.bat).Source
          $flutterRoot = Split-Path (Split-Path $flutterBat -Parent) -Parent
          ./scripts/build_windows_installer.ps1 -FlutterRoot $flutterRoot -IsccPath 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/NewChirp-Installer-*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true
      - name: Build macOS DMG
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml | head -1)"
          python3 -m venv .release-venv
          . .release-venv/bin/activate
          pip install --upgrade pip pillow dmgbuild
          flutter pub get
          flutter test test/update_checker_test.dart
          flutter build macos --release
          APP="build/macos/Build/Products/Release/NewChirp.app"
          CHIRP_ROOT="$(bash scripts/update_chirp.sh)"
          bash scripts/bundle_macos_runtime.sh \
            --resources-dir "$APP/Contents/Resources" \
            --chirp-source "$CHIRP_ROOT"
          plutil -extract CFBundleShortVersionString raw -o - \
            "$APP/Contents/Info.plist" | grep -Fx "$VERSION"
          python scripts/build_macos_dmg.py \
            --app "$APP" \
            --output "build/NewChirp-${VERSION}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/NewChirp-*.dmg
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true
      - name: Build Linux packages on Ubuntu 20.04 baseline
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_ROOT="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --volume "$FLUTTER_ROOT:$FLUTTER_ROOT" \
            --volume "$HOME/.pub-cache:$HOME/.pub-cache" \
            --workdir "$GITHUB_WORKSPACE" \
            --env "FLUTTER_ROOT=$FLUTTER_ROOT" \
            --env "PUB_CACHE=$HOME/.pub-cache" \
            --env "PATH=$FLUTTER_ROOT/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            ubuntu:20.04 \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                binutils clang cmake curl file g++ git libegl1 libegl-mesa0 \
                libgl1-mesa-dri libgles2 libgtk-3-dev liblzma-dev \
                libstdc++-10-dev ninja-build pkg-config python3 python3-venv \
                rpm xvfb zstd
              git config --global --add safe.directory "$FLUTTER_ROOT"
              git config --global --add safe.directory "$PWD"
              bash scripts/build_linux_release.sh
            '
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            build/NewChirp-linux-x64-*.deb
            build/NewChirp-linux-x64-*.rpm
            build/NewChirp-linux-x64-*.AppImage
            build/NewChirp-linux-x64-*.pkg.tar.zst
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches app version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml | head -1)"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
